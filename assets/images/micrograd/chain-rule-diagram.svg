<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1440e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="250" fill="#ffffff"/>

  <!-- forward row -->
  <text x="60" y="35" font-size="12" font-weight="700" fill="#555" text-anchor="start">Forward pass</text>

  <rect x="60" y="50" width="80" height="50" rx="8" fill="#f7f7f2" stroke="#2d2d2d" stroke-width="1.3"/>
  <text x="100" y="81" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">x</text>

  <rect x="290" y="50" width="120" height="50" rx="8" fill="#f2f6ff" stroke="#2d2d2d" stroke-width="1.3"/>
  <text x="350" y="81" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">y</text>

  <rect x="560" y="50" width="80" height="50" rx="8" fill="#fff4e8" stroke="#2d2d2d" stroke-width="1.3"/>
  <text x="600" y="81" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">L</text>

  <line x1="140" y1="75" x2="290" y2="75" stroke="#333" stroke-width="1.6" marker-end="url(#arrowF)"/>
  <line x1="410" y1="75" x2="560" y2="75" stroke="#333" stroke-width="1.6" marker-end="url(#arrowF)"/>
  <text x="215" y="65" font-size="12" fill="#333" text-anchor="middle">local: dy/dx</text>
  <text x="485" y="65" font-size="12" fill="#333" text-anchor="middle">upstream: dL/dy</text>

  <!-- backward row -->
  <text x="60" y="150" font-size="12" font-weight="700" fill="#c1440e" text-anchor="start">Backward pass</text>

  <rect x="60" y="165" width="80" height="50" rx="8" fill="#f7f7f2" stroke="#2d2d2d" stroke-width="1.3"/>
  <text x="100" y="196" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">x</text>

  <rect x="290" y="165" width="120" height="50" rx="8" fill="#f2f6ff" stroke="#2d2d2d" stroke-width="1.3"/>
  <text x="350" y="196" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">y</text>

  <rect x="560" y="165" width="80" height="50" rx="8" fill="#fff4e8" stroke="#2d2d2d" stroke-width="1.3"/>
  <text x="600" y="196" font-size="16" font-weight="700" text-anchor="middle" fill="#1a1a1a">L</text>

  <line x1="560" y1="190" x2="410" y2="190" stroke="#c1440e" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <line x1="290" y1="190" x2="140" y2="190" stroke="#c1440e" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="485" y="180" font-size="12" fill="#c1440e" text-anchor="middle">dL/dy</text>
  <text x="215" y="180" font-size="12" fill="#c1440e" text-anchor="middle">dL/dy &#183; dy/dx</text>
</svg>
