<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    <!-- ===== #feature:scroll-progress ===== -->
    <div id="scroll-progress-bar"></div>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <!-- ===== #feature:visitor-counter ===== -->
    {% include features-visitor-counter.html %}

    <!-- ===== #feature:search ===== -->
    {% include features-search-modal.html %}

    <!-- ===== #feature:lightbox ===== -->
    <div id="lightbox-overlay"><img id="lightbox-img" src="" alt=""></div>

    <script defer src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

  </body>

</html>
