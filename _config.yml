title: Your awesome title
email: your-email@example.com
description: >-
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # #config: 본인 블로그 주소로 채우기 (예: https://jungjinuuu.github.io) - 검색엔진(OG), RSS, 방문자 카운터가 이 값을 사용함
github_username: jungjinuuu
# linkedin_username: #config: 여기에 본인 LinkedIn 핸들을 넣으면 푸터에 자동으로 링크가 뜸 (예: jungjinuuu -> linkedin.com/in/jungjinuuu)

# ===== #feature:dark-mode =====
# 다크모드는 minima 내장 기능이 아니라 assets/main.scss의 #feature:dark-mode 블록 +
# assets/js/main.js의 초기화 스크립트로 직접 구현되어 있음 (버튼 클릭 시 html에 data-theme 속성을 토글)

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag # ===== #feature:seo-og ===== (OG 이미지/메타태그 자동 생성, url 값 필요)

# ===== #feature:categories =====
# 포스트 작성 시 front matter에 아래처럼 추가하면 /categories/ 페이지에 자동 반영됨.
# 여러 개를 넣으면 각 카테고리 페이지에 모두 나타나지만, 포스트 상단/홈 목록에 뜨는
# eyebrow 배지는 항상 첫 번째 값만 씀 — 대표 카테고리를 맨 앞에 쓸 것.
#   categories: [LLM]

# ===== #feature:comments-giscus =====
# 특정 포스트만 댓글을 끄고 싶으면 그 포스트 front matter에 comments: false 추가

# Exclude from processing.
# exclude: 여기 있는 파일/폴더는 Jekyll이 빌드에서 아예 무시함 (블로그 글로 만들지 않음)
exclude:
  - FEATURES.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
